<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    See / download code: ...loading...
  </title>
  <link rel="stylesheet" href="./_demos.css">
</head>
<body class="seeDownloadCodeFile">
  <h1>
    See / download code: <span class="placeholder">...loading...</span>
  </h1>
  <p class="info">
    Note that code is displayed here with auto text wrapping but downloaded with full line lengths
  </p>
  <div class="controls">
    <button class="download" disabled>
      Download Code
    </button>
  </div>
  <div class="code">
    <span class="placeholder">... loading ...</span>
  </div>
  <script defer>
    /** Trigger "Save as file" for given data or current HTML document
     *  - Throws an error if used outside browser (= no document object)
     * @example
     *  - save_as_file()
     *  - save_as_file( 'demo.json', '{ "key": "val" }' )
     *  - save_as_file( 'demo.txt', 'First line\nSecond line' )
     * @param [ file_name ] - file name to suggest for file to save, defaults to title of current HTML document + '.html'
     * @param [ data ] - data to save, defaults to current HTML document
     * @param [ mime_type ] - MIME type for data to save as, defaults to trying to guess from file_name's extension, falling back to "text/html"
     * @returns true on success, undefined false
     * @see {@link https://hh-lohmann.github.io/browser-save-data-as-file/}
     * @version 1.1.1
     * @type { ( file_name?:string, data?: string, mime_type?: string ) => boolean | undefined }
     */
    const save_as_file = function( file_name, data, mime_type ) {
      if( typeof document === 'undefined' ) throw Error( 'save_as_file: Can only be run in browsers (with document object)' )
      if( ! file_name ) file_name = `${ document.title }.html`
      if( ! data ) data = '<!DOCTYPE html>\\n' + document.documentElement.innerHTML
      if( ! mime_type ) {
        let extension = file_name.split( '.' ).slice( -1 )[ 0 ]
        if( extension === 'html' ) mime_type = 'text/html'
        if( extension === 'json' ) mime_type = 'application/json'
        if( extension === 'txt' ) mime_type = 'text/plain'
      }
      let hidden_a = document.createElement( 'a' )
      hidden_a.download = file_name
      hidden_a.href = URL.createObjectURL( new Blob( [ data ], { type: mime_type } ) )
      hidden_a.click()
      return true
    }
    const setBackLink=function(){
      const myReferrerSegmentsCount=document.referrer.split('/').length-1;
      if(myReferrerSegmentsCount>2){
        if(document.referrer.split('/').slice(0,myReferrerSegmentsCount).join('/')===location.href.split('/').slice(0,myReferrerSegmentsCount).join('/')){
          const myBtn=document.createElement('button');
          myBtn.innerText='Back';
          myBtn.onclick=()=>history.back();
          document.querySelector('.controls').appendChild(myBtn);
        }
      }
    }
    const setFile=function(){
      const _enableDownload=function(namePath,code){
        const myBtn=document.querySelector('body>.controls>.download');
        myBtn.disabled=false;
        myBtn.onclick=()=>save_as_file(namePath.split('/').slice(-1).pop(),code);
      }
      const _errExit=function(err){
        _setTitle(`--Error: ${err} --`);
        [ '.controls', '.code' ].forEach(value=>{
          document.querySelector('body>'+value).style.display='none';
        })
        throw SyntaxError('_seeDownloadCodeFile: '+err);
      }
      const _setCode=function(content){
        const myChild=document.createElement('pre');
        myChild.innerText=content;
        myChild.className='demoCode';
        document.querySelector('body>.code').replaceChildren(myChild);
      }
      const _setTitle=function(str){
        [ [ document, 'title' ], [ document.querySelector('h1'), 'innerText' ] ]
        .forEach(value=>{
          value[0][value[1]] = value[0][value[1]].replace('...loading...','\n'+str);
        })
      }
      const namePath=new URL(location.href).searchParams.get('file');
      if(!namePath) _errExit('No file to load');
      fetch(namePath)
      .then(res=>{
        if(res.status!==200) throw Error('HTTP '+res.status);
        _setTitle(namePath);
        return res.text();
      })
      .then(res=>{
        _enableDownload(namePath,res);
        _setCode(res);
      })
      .catch(err=>{
        _errExit('Can not load '+namePath);
      })
    }
    setBackLink();
    setFile();
  </script>
</body></html>
